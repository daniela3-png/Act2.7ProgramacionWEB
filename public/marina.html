<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fauna Marina de Iquique</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#e0f7fa;
}

header{
    background:#0077b6;
    color:white;
    text-align:center;
    padding:30px;
}

.contenedor{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
    padding:40px;
}

.tarjeta{
    background:white;
    width:350px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.tarjeta h2{
    color:#0077b6;
}

.tarjeta p{
    line-height:1.6;
}

.boton{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:#0077b6;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

.boton:hover{
    background:#023e8a;
}

footer{
    text-align:center;
    background:#023047;
    color:white;
    padding:15px;
}

.error{
    text-align:center;
    color:red;
    font-weight:bold;
    padding:20px;
}

</style>
</head>
<body>

<header>
    <h1>Fauna Marina de Iquique</h1>
    <p>Especies representativas de la costa de Tarapacá</p>
</header>

<!-- Contenedor vacío, JavaScript llenará las tarjetas -->
<div class="contenedor" id="contenedor">
    <p>Cargando datos...</p>
</div>

<div style="text-align:center; margin-bottom:30px;">
    <a href="index.html" class="boton">Volver al Inicio</a>
</div>

<footer>
    Proyecto Programación Web - Fauna de Iquique
</footer>

<script>
    // Llamamos al endpoint del backend para pedir los datos
    fetch('/api/fauna/marina')
        .then(function(respuesta) {
            
            if (!respuesta.ok) {
                throw new Error('Error del servidor: ' + respuesta.status);
            }
            // Convertimos la respuesta a JSON
            return respuesta.json();
        })
        .then(function(animales) {
            // Seleccionamos el contenedor donde van las tarjetas
            const contenedor = document.getElementById('contenedor');
            // Borramos el texto "Cargando datos..."
            contenedor.innerHTML = '';

            // Por cada animal que vino de la API, creamos una tarjeta
            animales.forEach(function(animal) {
                const tarjeta = document.createElement('div'); 
                tarjeta.classList.add('tarjeta');               

                // Llenamos la tarjeta con los datos 
                tarjeta.innerHTML = `
                    <h2>${animal.nombre}</h2>
                    <p><strong>Hábitat:</strong> ${animal.habitat}</p>
                    <p>${animal.info}</p>
                `;

                // Agregamos la tarjeta al contenedor
                contenedor.appendChild(tarjeta);
            });
        })
        .catch(function(error) {
            
            const contenedor = document.getElementById('contenedor');
            contenedor.innerHTML = '<p class="error">No se pudieron cargar los datos: ' + error.message + '</p>';
        });
</script>

</body>
</html>
